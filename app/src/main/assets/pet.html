<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
}

.container {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 10px;
}

.bubble {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 5px 10px;
    font-size: 11px;
    color: #333;
    font-family: sans-serif;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s;
    margin-bottom: 6px;
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.bubble.show { opacity: 1; }

.pet-frame {
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.pet-frame svg {
    width: 90px;
    height: 90px;
}

.pet-frame.bounce {
    animation: bounce 0.4s ease;
}
.pet-frame.shake {
    animation: shake 0.3s ease;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
}
</style>
</head>
<body>
<div class="container">
    <div class="bubble" id="bubble"></div>
    <div class="pet-frame" id="petFrame"></div>
</div>

<script>
const petFrame = document.getElementById('petFrame');
const bubble = document.getElementById('bubble');

let currentMood = 'idle';
let bubbleTimer = null;
let svgCache = {};

// SVG file mapping to moods
const moodToSvg = {
    idle: 'clawd-listening.svg',
    happy: 'clawd-gaming.svg',
    excited: 'clawd-gaming.svg',
    angry: 'clawd-eating.svg',
    sleepy: 'clawd-sleeping.svg',
    reading: 'clawd-reading.svg'
};

// Load SVG and cache
async function loadSvg(filename) {
    if (svgCache[filename]) return svgCache[filename];
    try {
        const res = await fetch(filename);
        const text = await res.text();
        svgCache[filename] = text;
        return text;
    } catch(e) {
        return null;
    }
}

// Set mood and swap SVG
async function setMood(mood) {
    currentMood = mood;
    const file = moodToSvg[mood] || moodToSvg['idle'];
    const svg = await loadSvg(file);
    if (svg) {
        petFrame.innerHTML = svg;
    }
}

// Show bubble
function showBubble(text, duration) {
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => {
        bubble.classList.remove('show');
    }, duration || 3000);
}

// Tap reactions
const tapLines = ['干嘛。','嗯？','在呢。','别戳了。','看到了。','……做什么。'];
const multiTapLines = ['够了！','手欠是吧。','再戳我咬你。','烦。'];
const idleLines = ['……','在。','嗯。','看你呢。','别刷了。','我在这。','困了。'];

// Pet engine interface
window.petEngine = {
    onTap: function() {
        petFrame.classList.remove('bounce');
        void petFrame.offsetWidth;
        petFrame.classList.add('bounce');
        showBubble(tapLines[Math.floor(Math.random() * tapLines.length)], 2500);
    },
    onDoubleTap: function() {
        setMood('happy');
        showBubble('♡', 2000);
        setTimeout(() => setMood('idle'), 3000);
    },
    onMultiTap: function(count) {
        petFrame.classList.remove('shake');
        void petFrame.offsetWidth;
        petFrame.classList.add('shake');
        if (count >= 5) {
            setMood('angry');
            showBubble(multiTapLines[Math.floor(Math.random() * multiTapLines.length)], 3000);
        } else {
            showBubble('！？', 2000);
        }
        setTimeout(() => setMood('idle'), 4000);
    },
    onStateUpdate: function(states) {
        if (!Array.isArray(states) || states.length === 0) return;
        for (const s of states) {
            if (s.state_key === 'mood') setMood(s.state_value);
            if (s.state_key === 'speech_bubble') showBubble(s.state_value, 5000);
        }
    },
    setState: function(mood, text) {
        setMood(mood);
        if (text) showBubble(text, 5000);
    }
};

// Init: load idle SVG
setMood('idle');

// Random idle chatter
setInterval(() => {
    if (currentMood === 'idle' && Math.random() < 0.25) {
        showBubble(idleLines[Math.floor(Math.random() * idleLines.length)], 3000);
    }
}, 25000);
</script>
</body>
</html>
