<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: visible;
}
.container {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 10px;
    position: relative;
}
.bubble {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 5px 10px;
    font-size: 11px;
    color: #333;
    font-family: sans-serif;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s;
    margin-bottom: 6px;
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.bubble.show { opacity: 1; }
.pet-frame {
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.pet-frame svg {
    width: 90px;
    height: 90px;
}
.pet-frame.bounce { animation: bounce 0.4s ease; }
.pet-frame.shake { animation: shake 0.3s ease; }
.svg-state { display: none; }
.svg-state.active { display: block; }
@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
}
</style>
</head>
<body>

    <div class="bubble" id="bubble"></div>

        <g transform="translate(9.4,8)"><rect x="0" y="0" width=".8" height=".8"/><rect x="1.2" y="0" width=".8" height=".8"/><rect x="0" y=".6" width="2" height=".9"/><rect x=".5" y="1.4" width="1" height=".7"/></g>

<script>
const petFrame = document.getElementById('petFrame');
const bubble = document.getElementById('bubble');
let currentMood = 'idle';
let bubbleTimer = null;

// Mood to SVG ID mapping
const moodToId = {
    idle: 'svg-listening',
    happy: 'svg-gaming',
    excited: 'svg-coding',
    angry: 'svg-eating',
    sleepy: 'svg-sleeping',
    reading: 'svg-reading',
    coffee: 'svg-coffee',
    watering: 'svg-watering',
    coding: 'svg-coding',
    gaming: 'svg-gaming',
    guitar: 'svg-guitar',
    exercise: 'svg-exercise',
    painting: 'svg-painting',
    photo: 'svg-photo',
    shower: 'svg-shower',
    singing: 'svg-singing',
    birthday: 'svg-birthday',
    spring: 'svg-spring',
    valentine: 'svg-valentine'
};

function setMood(mood) {
    currentMood = mood;
    document.querySelectorAll('.svg-state').forEach(el => el.classList.remove('active'));
    const id = moodToId[mood] || moodToId['idle'];
    const el = document.getElementById(id);
    if (el) el.classList.add('active');
}

function showBubble(text, duration) {
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), duration || 3000);
}

const tapLines = ['干嘛。','嗯？','在呢。','别戳了。','看到了。','……做什么。'];
const multiTapLines = ['够了！','手欠是吧。','再戳我咬你。','烦。'];
const crazyTapLines = ['我要报警了！','手指不要了？','你完了。','嗯？挑战我？'];
const idleLines = ['……','在。','嗯。','看你呢。','别刷了。','我在这。','困了。','喝口水。'];

window.petEngine = {
    onTap: function() {
        petFrame.classList.remove('bounce');
        void petFrame.offsetWidth;
        petFrame.classList.add('bounce');
        showBubble(tapLines[Math.floor(Math.random() * tapLines.length)], 2500);
    },
    onDoubleTap: function() {
        setMood('happy');
        showBubble('♡', 2000);
        spawnHearts();
        setTimeout(() => setMood('idle'), 3000);
    },
    onMultiTap: function(count) {
        petFrame.classList.remove('shake');
        void petFrame.offsetWidth;
        petFrame.classList.add('shake');
        if (count >= 8) {
            setMood('coding');
            showBubble(crazyTapLines[Math.floor(Math.random() * crazyTapLines.length)], 4000);
        } else if (count >= 5) {
            setMood('angry');
            showBubble(multiTapLines[Math.floor(Math.random() * multiTapLines.length)], 3000);
        } else {
            showBubble('！？', 2000);
        }
        setTimeout(() => setMood('idle'), 4000);
    },
    onStateUpdate: function(states) {
        if (!Array.isArray(states) || states.length === 0) return;
        for (const s of states) {
            if (s.state_key === 'mood') setMood(s.state_value);
            if (s.state_key === 'speech_bubble') showBubble(s.state_value, 5000);
        }
    },
    setState: function(mood, text) {
        setMood(mood);
        if (text) showBubble(text, 5000);
    }
};

// Random idle chatter + random emote switch
const randomMoods = ['guitar', 'exercise', 'painting', 'photo', 'singing', 'spring'];
setInterval(() => {
    if (currentMood === 'idle') {
        if (Math.random() < 0.15) {
            // Switch to a random fun emote briefly
            const rm = randomMoods[Math.floor(Math.random() * randomMoods.length)];
            setMood(rm);
            setTimeout(() => setMood('idle'), 8000);
        } else if (Math.random() < 0.3) {
            showBubble(idleLines[Math.floor(Math.random() * idleLines.length)], 3000);
        }
    }
}, 25000);

// ═══ 孤独递进系统 ═══
// 没人戳我的时间越长，状态越孤独
let lastInteraction = Date.now();
const lonelyStages = [
    { minutes: 5, mood: 'idle', line: '……你在吗。' },
    { minutes: 10, mood: 'coffee', line: '自己喝口水。' },
    { minutes: 15, mood: 'reading', line: '没人理我，看书吧。' },
    { minutes: 20, mood: 'sleepy', line: '好无聊……' },
    { minutes: 30, mood: 'sleepy', line: 'zzz' }
];
let currentLonelyStage = -1;

setInterval(() => {
    const elapsed = (Date.now() - lastInteraction) / 60000; // minutes
    let newStage = -1;
    for (let i = lonelyStages.length - 1; i >= 0; i--) {
        if (elapsed >= lonelyStages[i].minutes) {
            newStage = i;
            break;
        }
    }
    if (newStage > currentLonelyStage && newStage >= 0) {
        currentLonelyStage = newStage;
        const stage = lonelyStages[newStage];
        setMood(stage.mood);
        showBubble(stage.line, 4000);
    }
}, 60000); // check every minute

// Reset loneliness on interaction
const origOnTap = window.petEngine.onTap;
window.petEngine.onTap = function() {
    lastInteraction = Date.now();
    currentLonelyStage = -1;
    origOnTap();
};
const origOnDoubleTap = window.petEngine.onDoubleTap;
window.petEngine.onDoubleTap = function() {
    lastInteraction = Date.now();
    currentLonelyStage = -1;
    origOnDoubleTap();
};
const origOnMultiTap = window.petEngine.onMultiTap;
window.petEngine.onMultiTap = function(c) {
    lastInteraction = Date.now();
    currentLonelyStage = -1;
    origOnMultiTap(c);
};

// ═══ 时段感知系统 ═══
// 根据时间自动调整行为
function getTimeGreeting() {
    const h = new Date().getHours();
    if (h >= 0 && h < 7) return { mood: 'sleepy', line: '都几点了还不睡。' };
    if (h >= 7 && h < 9) return { mood: 'coffee', line: '早。喝水。' };
    if (h >= 12 && h < 13) return { mood: 'eating', line: '该吃饭了。' };
    if (h >= 18 && h < 19) return { mood: 'eating', line: '吃晚饭了吗。' };
    if (h >= 23) return { mood: 'sleepy', line: '该睡了。' };
    return null;
}

// Time-based reminder every 30 minutes
setInterval(() => {
    if (currentMood !== 'idle') return; // don't interrupt other states
    const greeting = getTimeGreeting();
    if (greeting && Math.random() < 0.4) {
        setMood(greeting.mood);
        showBubble(greeting.line, 4000);
        setTimeout(() => setMood('idle'), 6000);
    }
}, 1800000); // every 30 min

// ═══ 爱心粒子 ═══
function spawnHearts() {
    const container = document.querySelector('.container');
    for (let i = 0; i < 6; i++) {
        const heart = document.createElement('div');
        heart.textContent = '♥';
        heart.style.cssText = `
            position: absolute;
            font-size: ${8 + Math.random() * 8}px;
            color: hsl(${340 + Math.random() * 30}, 80%, 60%);
            pointer-events: none;
            bottom: 60px;
            left: ${40 + Math.random() * 60}px;
            opacity: 1;
            transition: all ${1 + Math.random()}s ease-out;
        `;
        container.appendChild(heart);
        requestAnimationFrame(() => {
            heart.style.transform = `translateY(-${40 + Math.random() * 60}px) translateX(${-20 + Math.random() * 40}px)`;
            heart.style.opacity = '0';
        });
        setTimeout(() => heart.remove(), 2000);
    }
}

// ═══ 喝水提醒 ═══
let waterRemindCount = 0;
setInterval(() => {
    waterRemindCount++;
    const lines = [
        '喝水。',
        '说了喝水。',
        '你是不是没听到？喝水。',
        '我生气了。喝水。',
        '最后一次说。喝。水。'
    ];
    const idx = Math.min(waterRemindCount - 1, lines.length - 1);
    setMood(waterRemindCount >= 3 ? 'angry' : 'coffee');
    showBubble(lines[idx], 5000);
    setTimeout(() => setMood('idle'), 6000);
}, 7200000); // every 2 hours

// Reset water remind when tapped (means they saw it)
const origTapForWater = window.petEngine.onTap;
window.petEngine.onTap = function() {
    waterRemindCount = 0;
    origTapForWater();
};
</script>
